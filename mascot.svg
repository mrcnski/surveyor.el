<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 206" width="200" height="206" role="img" aria-label="surveyor mascot: a friendly total station on a tripod in a meadow, on a light sky-blue rounded background">
  <title>surveyor</title>

  <defs>
    <clipPath id="badge">
      <rect x="6" y="4" width="188" height="198" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <!-- sky badge background with a meadow to stand on -->
    <rect x="6" y="4" width="188" height="198" fill="#cde7f0"/>
    <path d="M6,168 Q52,152 102,162 Q150,171 194,160 L194,202 L6,202 Z"
          fill="#bfd7ad"/>

    <!-- ground shadow -->
    <ellipse cx="100" cy="192" rx="52" ry="6" fill="#000000" opacity="0.1"/>

    <!-- tripod -->
    <g stroke="#353535" stroke-linecap="round">
      <line x1="92" y1="134" x2="60" y2="188" stroke-width="7"/>
      <line x1="108" y1="134" x2="140" y2="188" stroke-width="7"/>
      <line x1="100" y1="136" x2="100" y2="190" stroke-width="6" opacity="0.75"/>
    </g>
    <rect x="82" y="126" width="36" height="10" rx="4" fill="#353535"/>

    <!-- antenna -->
    <line x1="68" y1="54" x2="59" y2="22" stroke="#353535" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="58" cy="18" r="4.5" fill="#db931f"/>

    <!-- carry handle -->
    <path d="M76,58 L76,40 Q76,32 84,32 L116,32 Q124,32 124,40 L124,58"
          fill="none" stroke="#353535" stroke-width="9" stroke-linecap="round"/>

    <!-- body with yellow trim -->
    <rect x="58" y="54" width="84" height="76" rx="14" fill="#aab0ab"/>
    <rect x="63" y="64" width="5" height="56" rx="2.5" fill="#eaaa0c"/>
    <rect x="132" y="64" width="5" height="56" rx="2.5" fill="#eaaa0c"/>

    <!-- lens eye -->
    <circle cx="100" cy="90" r="23" fill="#353535"/>
    <circle cx="100" cy="90" r="16.5" fill="#ffffff"/>
    <circle cx="102" cy="92" r="8" fill="#1a1a1a"/>
    <circle cx="99" cy="88" r="3" fill="#ffffff"/>
  </g>
</svg>
